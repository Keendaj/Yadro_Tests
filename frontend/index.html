<!DOCTYPE html>
<html lang="en" class="bg-emerald-950 text-emerald-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #022c22; } 
        ::-webkit-scrollbar-thumb { background: #065f46; border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: #047857; } 
    </style>
</head>
<body class="p-6 min-h-screen flex flex-col gap-6 max-w-[1400px] mx-auto font-sans pb-12">

    <header class="flex justify-between items-center bg-emerald-900 p-4 rounded-xl border border-emerald-800 shadow-lg">
        <div class="flex flex-col">
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-3">
                <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                System Monitor
            </h1>
            <div id="system-stats" class="text-sm font-mono text-emerald-400 mt-2 flex flex-wrap gap-x-6 gap-y-1">
            </div>
        </div>
        <div class="flex items-center gap-2 bg-emerald-950 px-4 py-2 rounded-lg border border-emerald-800 h-fit">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)] animate-pulse"></div>
            <span id="connection-status" class="text-sm font-medium text-emerald-300">Connecting...</span>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-emerald-900 p-6 rounded-xl border border-emerald-800 shadow-lg flex flex-col items-center">
            <h2 class="text-lg font-semibold text-emerald-100 mb-4 w-full text-left">CPU Total</h2>
            <div class="relative w-full h-48">
                <canvas id="cpuChart"></canvas>
            </div>
            <div id="cpu-text" class="w-full mt-4 text-center text-2xl font-mono font-bold text-emerald-100">0.0%</div>
        </div>

        <div class="bg-emerald-900 p-6 rounded-xl border border-emerald-800 shadow-lg flex flex-col">
            <h2 class="text-lg font-semibold text-emerald-100 mb-4">CPU Cores</h2>
            <div id="cpuCores" class="flex flex-col gap-2 overflow-y-auto pr-2 flex-1 max-h-[220px]">
            </div>
        </div>

        <div class="bg-emerald-900 p-6 rounded-xl border border-emerald-800 shadow-lg flex flex-col items-center">
            <h2 class="text-lg font-semibold text-emerald-100 mb-4 w-full text-left">Memory Usage</h2>
            <div class="relative w-full h-48">
                <canvas id="ramChart"></canvas>
            </div>
            <div id="ram-text" class="w-full mt-2"></div>
        </div>
    </div>

    <div class="bg-emerald-900 rounded-xl border border-emerald-800 shadow-lg">
        <div class="p-4 border-b border-emerald-800 bg-emerald-900/50">
            <h2 class="text-lg font-semibold text-emerald-100">Processes</h2>
        </div>
        <div class="overflow-x-auto w-full">
            <table id="processTable" class="w-full text-left border-collapse">
                <thead class="bg-emerald-950/50 text-xs uppercase text-emerald-400">
                    <tr>
                        <th class="p-3 font-semibold">PID</th>
                        <th class="p-3 font-semibold">User</th>
                        <th class="p-3 font-semibold">PRI</th>
                        <th class="p-3 font-semibold">State</th>
                        <th class="p-3 font-semibold">CPU %</th>
                        <th class="p-3 font-semibold">MEM %</th>
                        <th class="p-3 font-semibold" title="Execution Time">TIME+</th>
                        <th class="p-3 font-semibold">RES</th>
                        <th class="p-3 font-semibold">VIRT</th>
                        <th class="p-3 font-semibold">Command</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-emerald-800/50" id="processTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
